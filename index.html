<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDA AI Online Assistant</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .chat-header {
            padding: 18px 20px;
            background: var(--primary-color);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .lang-select {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            background: white;
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            max-width: 180px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #fdfdfd;
        }
        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .user-message {
            background: var(--primary-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }
        .ai-message {
            background: #f1f5f9;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 3px;
            border: 1px solid #e2e8f0;
        }
        .chat-input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }
        .chat-input-area input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }
        .chat-input-area button {
            padding: 12px 22px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .chat-input-area button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>TDA AI Online Assistant</h2>
        <select id="languageSelect" class="lang-select">
            <option value="English">English</option>
            <option value="Spanish">Español</option>
            <option value="French">Français</option>
            <option value="Arabic">العربية</option>
            <option value="Mandarin">中文</option>
            <option value="Hindi">हिन्दी</option>
            <option value="Portuguese">Português</option>
            <option value="Russian">Русский</option>
            <option value="German">Deutsch</option>
            <option value="Japanese">日本語</option>
            <option value="Swahili">Kiswahili</option>
            <option value="Italian">Italiano</option>
            <!-- Newly requested additions -->
            <option value="Hebrew">עברית (Hebrew)</option>
            <option value="Korean">한국어 (Korean)</option>
            <option value="Persian">فارسی (Persian)</option>
            <option value="Vietnamese">Tiếng Việt (Vietnamese)</option>
            <option value="Filipino">Filipino</option>
            <option value="Greek">Ελληνικά (Greek)</option>
            <option value="Turkish">Türkçe (Turkish)</option>
            <option value="Urdu">اردو (Urdu / Pakistan)</option>
            <option value="Tigrinya">ትግርኛ (Tigrinya / Eritrea)</option>
            <option value="Somali">Soomaaliga (Somali)</option>
        </select>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">Hello! I am TDA AI. Ask me anything, and I will source information live from the web and answer you in your preferred language.</div>
    </div>
    
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Ask a live question..." autocomplete="off">
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const languageSelect = document.getElementById('languageSelect');

    const API_ENDPOINT = '/api/chat'; 

    async function handleUserQuery() {
        const text = userInput.value.trim();
        const selectedLang = languageSelect.value;
        if (!text) return;

        appendMessage(text, 'user-message');
        userInput.value = '';
        
        const loadingId = appendMessage('Searching the web and translating...', 'ai-message');

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    prompt: text, 
                    language: selectedLang 
                })
            });

            const data = await response.json();
            removeMessage(loadingId);
            
            if(data.reply) {
                appendMessage(data.reply, 'ai-message');
            } else {
                appendMessage('Sorry, received an empty response from TDA AI server.', 'ai-message');
            }

        } catch (error) {
            removeMessage(loadingId);
            appendMessage('Error: Unable to connect to online services.', 'ai-message');
        }
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        const id = 'msg_' + Date.now() + Math.random();
        msgDiv.id = id;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return id;
    }

    function removeMessage(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    sendBtn.addEventListener('click', handleUserQuery);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleUserQuery();
    });
</script>

</body>
</html>
